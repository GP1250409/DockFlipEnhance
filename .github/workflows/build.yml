name: Build DockFlipEnhance (RootHide & Rootless)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-roothide:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos (RootHide)
        run: |
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          mkdir -p ~/theos/sdks
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz -C /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk ~/theos/sdks/

      - name: Install ldid & dpkg
        run: |
          brew install ldid dpkg

      - name: Build RootHide arm64e deb
        env:
          THEOS: ${{ env.THEOS }}
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -la packages/

      - name: Upload RootHide deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DockFlipEnhance-roothide-arm64e
          path: packages/*.deb

  build-rootless:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos (Rootless)
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          mkdir -p ~/theos/sdks
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz -C /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk ~/theos/sdks/

      - name: Install ldid & dpkg
        run: |
          brew install ldid dpkg

      - name: Prepare Rootless control metadata
        run: |
          cat > control << 'EOF'
          Package: cc.gonepaul.dockflipenhance.rootless
          Name: DockFlip 增强补丁 (Rootless)
          Version: 0.3.1
          Architecture: iphoneos-arm64
          Description: All-in-one DockFlip enhancement for Dopamine Rootless iOS 16 arm64: native badge sync, bidirectional infinite dock paging, Plus landscape vertical Dock support, native SBIconView Quick Actions menu, and AppData / Choicy support.
          Maintainer: Paul
          Author: Paul
          Section: Tweaks
          Depends: ellekit | mobilesubstrate, wiki.qaq.dockflip
          Conflicts: cc.gonepaul.dockflipbadge.rootless
          Replaces: cc.gonepaul.dockflipbadge.rootless
          EOF

      - name: Build Rootless arm64 deb
        env:
          THEOS: ${{ env.THEOS }}
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/

      - name: Upload Rootless deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DockFlipEnhance-rootless-arm64
          path: packages/*.deb
